<div class="login">
  <a routerLink="/" class="login__back">
    <app-icon name="arrow-left" [size]="16" />
    Volver al sitio
  </a>

  <app-card padding="lg" class="login__card">
    <header class="login__header">
      <span class="login__mark"><app-icon name="dumbbell" [size]="22" /></span>
      <h1 class="login__title">Ingresar</h1>
      <p class="login__subtitle text-muted">
        Accedé a tu portal de {{ brand.name }} con el email y la contraseña que te dio el gimnasio.
      </p>
    </header>

    <form class="login__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <app-form-field label="Email" inputId="login-email" [error]="emailError">
        <input
          id="login-email"
          type="email"
          formControlName="email"
          autocomplete="username"
          inputmode="email"
          placeholder="tu@email.com"
          [attr.aria-invalid]="emailError ? 'true' : null"
          [attr.aria-describedby]="emailError ? 'login-email-error' : null"
        />
      </app-form-field>

      <app-form-field label="Contraseña" inputId="login-password" [error]="passwordError">
        <input
          id="login-password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••"
          [attr.aria-invalid]="passwordError ? 'true' : null"
          [attr.aria-describedby]="passwordError ? 'login-password-error' : null"
        />
      </app-form-field>

      @if (errorMessage()) {
        <p class="login__error" role="alert">
          <app-icon name="alert-triangle" [size]="16" />
          {{ errorMessage() }}
        </p>
      }

      <button app-button type="submit" size="lg" [block]="true" [loading]="submitting()">
        Ingresar
      </button>
    </form>

    <p class="login__help text-muted">
      ¿No tenés cuenta o no recordás tu contraseña? Comunicate con el gimnasio.
    </p>
  </app-card>
</div>
